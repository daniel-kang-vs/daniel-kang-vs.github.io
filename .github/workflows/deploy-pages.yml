name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p _site/pngs _site/projects _site/nyc-taxi-fleet-optimization
          cp index.html style.css resume.pdf projects.html journey.html image_portfolio.jpeg _site/
          cp -R pngs/. _site/pngs/
          cp -R projects/. _site/projects/
          cp -R "Project/mgmt590-team03-project/docs/." _site/nyc-taxi-fleet-optimization/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
